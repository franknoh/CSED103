[project]
name = "csed103"
version = "0.1.0"
description = "CSED103 coursework"
requires-python = ">=3.12"
dependencies = [
    "csed103-cli",
    "ppy-lang[llvm]>=0.3.4",
]

[tool.uv.workspace]
members = ["tools/csed103"]

[tool.uv.sources]
csed103-cli = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

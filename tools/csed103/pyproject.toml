[project]
name = "csed103-cli"
version = "0.1.0"
description = "Build, test, and package CSED103 assignments"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3"]

[project.scripts]
csed103 = "csed103.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csed103"]

name: assign1

problems:
  problem1:
    sources:
      - src/problem1.c
    tests: tests/problem1

  problem2:
    sources:
      - src/problem2.c
    tests: tests/problem2

ppy:
  mode: standalone
  defines: [_CRT_SECURE_NO_WARNINGS]
  targets:
    ppy/problem1.ppy: [src/problem1.c]
    ppy/problem2.ppy: [src/problem2.c]

examples:
  problem1:
    input: tests/problem1/sample.in
    prompt: 'Number of cars: |Car [0-9]+ parking time \(minutes\): '
  problem2:
    input: tests/problem2/budget_0750.in
    prompt: 'Budget \(won\): '

submission:
  archive_prefix: assn1
  include:
    - src/problem1.c
    - src/problem2.c
